<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script>
    // Fetch activities, render cards with participants list, populate select, handle signup
    (function () {
      const activitiesList = document.getElementById("activities-list");
      const activitySelect = document.getElementById("activity");
      const signupForm = document.getElementById("signup-form");
      const emailInput = document.getElementById("email");
      const messageEl = document.getElementById("message");

      function showMessage(text, cls = "info") {
        messageEl.className = `message ${cls}`;
        messageEl.textContent = text;
      }

      function clearMessage() {
        messageEl.className = "hidden";
        messageEl.textContent = "";
      }

      function renderActivities(data) {
        activitiesList.innerHTML = "";
        // Clear select options (keep placeholder)
        activitySelect.querySelectorAll("option:not([value=''])").forEach(o => o.remove());

        Object.keys(data).forEach(name => {
          const a = data[name];

          // Card
          const card = document.createElement("div");
          card.className = "activity-card";

          const h4 = document.createElement("h4");
          h4.textContent = name;
          card.appendChild(h4);

          const desc = document.createElement("p");
          desc.textContent = a.description;
          card.appendChild(desc);

          const sched = document.createElement("p");
          sched.textContent = `Schedule: ${a.schedule}`;
          card.appendChild(sched);

          const cap = document.createElement("p");
          cap.textContent = `Capacity: ${a.participants.length} / ${a.max_participants}`;
          card.appendChild(cap);

          // Participants section
          const partSection = document.createElement("div");
          partSection.className = "participants-section";
          const partHeading = document.createElement("strong");
          partHeading.textContent = "Participants:";
          partSection.appendChild(partHeading);

          const ul = document.createElement("ul");
          ul.className = "participants-list";
          if (a.participants && a.participants.length) {
            a.participants.forEach(p => {
              const li = document.createElement("li");
              li.textContent = p;
              ul.appendChild(li);
            });
          } else {
            const li = document.createElement("li");
            li.textContent = "No participants yet";
            li.className = "muted";
            ul.appendChild(li);
          }
          partSection.appendChild(ul);
          card.appendChild(partSection);

          activitiesList.appendChild(card);

          // add to select
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          activitySelect.appendChild(opt);
        });
      }

      function loadActivities() {
        fetch("/activities")
          .then(r => r.json())
          .then(data => {
            renderActivities(data);
          })
          .catch(() => {
            activitiesList.innerHTML = "<p class='error'>Failed to load activities.</p>";
          });
      }

      signupForm.addEventListener("submit", (e) => {
        e.preventDefault();
        clearMessage();
        const email = emailInput.value.trim();
        const activity = activitySelect.value;
        if (!email || !activity) {
          showMessage("Please provide an email and select an activity.", "error");
          return;
        }

        // POST signup (email as query param per API signature)
        fetch(`/activities/${encodeURIComponent(activity)}/signup?email=${encodeURIComponent(email)}`, {
          method: "POST"
        })
          .then(async res => {
            if (!res.ok) {
              const err = await res.json().catch(()=>({detail: "Signup failed"}));
              throw new Error(err.detail || "Signup failed");
            }
            return res.json();
          })
          .then(() => {
            showMessage(`Signed up ${email} for ${activity}`, "success");
            emailInput.value = "";
            loadActivities(); // refresh participants
          })
          .catch(err => {
            showMessage(err.message || "Signup failed", "error");
          });
      });

      // initial load
      loadActivities();
    })();
    </script>
  </body>
</html>
